FileVersion = 1

[Project]
Name = "LuaTinker.Playground"
StartupObject = "LuaTinker.Playground.Program"

[Dependencies]
corlib = "*"
KeraLua = "*"
LuaTinker = "*"
SDL2 = "*"
BeefGL = {Git = "https://github.com/disarray2077/BeefGL"}
StbImageBeef = {Git = "https://github.com/StbBeef/StbImageBeef?path=/src/StbImageBeef"}

[Configs.Debug.Win64]
DebugCommandArguments = "dist/breakout/main.lua"

[Configs.Debug.Linux64]
OtherLinkFlags = "$(LinkFlags) -lSDL2_image -lSDL2_mixer"

[Configs.Release.Linux64]
OtherLinkFlags = "$(LinkFlags) -lSDL2_image -lSDL2_mixer"

[Configs.Release.wasm32]
TargetDirectory = "$(WorkspaceDir)/build/wasm/playground"
TargetName = "LuaTinkerPlayground.html"
OtherLinkFlags = "$(LinkFlags) $(WorkspaceDir)/build/wasm/liblua54.a -sUSE_SDL=2 --use-port=sdl2_image:formats=png,jpg --use-port=sdl2_mixer -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=1048576 -sASSERTIONS=1 -sINVOKE_RUN=0 -sEXPORTED_RUNTIME_METHODS=callMain,wasmTable,ccall -sEXPORTED_FUNCTIONS=_main,_PlaygroundStart,_PlaygroundStop --shell-file $(WorkspaceDir)/Playground/dist/web/shell.html --preload-file $(WorkspaceDir)/Playground/dist/sdl_render.lua@/templates/sdl_render.lua --preload-file $(WorkspaceDir)/Playground/dist/gl_render.lua@/templates/gl_render.lua --preload-file $(WorkspaceDir)/Playground/dist/modules@/templates/modules --preload-file $(WorkspaceDir)/Playground/dist/rope@/templates/rope --preload-file $(WorkspaceDir)/Playground/dist/breakout@/templates/breakout --pre-js $(WorkspaceDir)/Playground/dist/web/playground.js"

[Configs.Release.Win64]
DebugCommandArguments = "dist/breakout/main.lua"
