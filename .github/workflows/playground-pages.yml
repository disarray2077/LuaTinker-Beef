name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main, playground]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Playground/web/package-lock.json

      - name: Check bundled example update hashes
        env:
          TEMPLATE_BASE: ${{ github.event.before }}
        run: |
          $base = $env:TEMPLATE_BASE
          if (!$base -or $base -match '^0+$') {
            git rev-parse --verify HEAD^ >$null 2>&1
            if ($LASTEXITCODE) { exit 0 }
            $base = 'HEAD^'
          }
          node Playground/web/update-template-hashes.mjs --check --base $base

      - name: Set up pinned Beef compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'BeefSetup.exe'
          $beefRoot = Join-Path $env:RUNNER_TEMP 'Beef'
          # Beef commit 301192e1fc518bbd36bf9c114f89e0525e04e7d1.
          Invoke-WebRequest 'https://nightly.beeflang.org/BeefSetup_0_43_6__10_23_2026.exe' -OutFile $setup
          & 7z x $setup "-o$beefRoot" -y
          if ($LASTEXITCODE) { throw 'Cannot extract Beef nightly.' }
          Copy-Item "$beefRoot/__user/*" $beefRoot -Recurse -Force
          "BEEF_ROOT=$beefRoot" >> $env:GITHUB_ENV

      - name: Fetch Beef's Emscripten SDK
        shell: cmd
        working-directory: ${{ runner.temp }}/Beef/wasm
        run: call fetch_wasm.bat

      - name: Configure Emscripten
        run: |
          $sdk = "$env:BEEF_ROOT/wasm/emsdk".Replace('\', '/')
          @"
          FileVersion = 1
          [Wasm]
          EmscriptenPath = "$sdk"
          "@ | Set-Content "$env:BEEF_ROOT/bin/BeefSettings.toml" -Encoding utf8

      - name: Build Playground
        shell: cmd
        run: |
          call "%BEEF_ROOT%\wasm\emsdk\emsdk_env.bat"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts\build-wasm.ps1 -Emsdk "%BEEF_ROOT%\wasm\emsdk" -BeefBuild "%BEEF_ROOT%\bin\BeefBuild.exe"

      - name: Check Playground frontend
        run: |
          npm --prefix Playground/web run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix Playground/web run format:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix Playground/web test

      - name: Prepare site
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'build/wasm/playground'
          $site = 'build/pages'
          New-Item -ItemType Directory -Force $site | Out-Null
          Copy-Item "$output/LuaTinkerPlayground.html" "$site/index.html"
          Copy-Item "$output/ui.js" $site
          Copy-Item "$output/ui.css" $site
          foreach ($extension in @('js', 'wasm', 'data')) {
            Copy-Item "$output/LuaTinkerPlayground.$extension" $site
          }

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
