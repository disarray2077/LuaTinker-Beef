FileVersion = 1
ExtraPlatforms = ["Linux32"]

[Workspace]
StartupProject = "LuaTinker.Playground"

[Projects]
LuaTinker = {Path = "."}
KeraLua = {Git = "https://github.com/disarray2077/KeraLua-Beef"}
"LuaTinker.Tests" = {Path = "Tests"}
"LuaTinker.BasicSample" = {Path = "Sample"}
"LuaTinker.GameSample" = {Path = "GameSample"}
"LuaTinker.Playground" = {Path = "Playground"}
BeefGL = {Git = "https://github.com/disarray2077/BeefGL"}
StbImageBeef = {Git = "https://github.com/StbBeef/StbImageBeef?path=/src/StbImageBeef"}
SDL2 = "*"
BeefForms = {Git = "https://github.com/disarray2077/BeefForms"}
"BeefForms.SDL" = {Git = "https://github.com/disarray2077/BeefForms?path=/BeefForms.SDL"}

[Configs.Debug.Win64]
AllocStackTraceDepth = 5
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Debug.wasm32]
AllocType = "CRT"
EnableObjectDebugFlags = false
EmitObjectAccessCheck = false
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}, "LuaTinker.BasicSample" = {Enabled = false}, "LuaTinker.GameSample" = {Enabled = false}}

[Configs.Debug.Linux64]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Release_O0.Win64]
LTOType = "None"
ConfigSelections = {LuaTinker = {Config = "Release"}, "LuaTinker.Tests" = {Enabled = false, Config = "Release"}, KeraLua = {Config = "Release"}, "LuaTinker.BasicSample" = {Config = "Release"}}

[Configs.Release_O0.Linux64]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Release_O0.wasm32]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}, "LuaTinker.BasicSample" = {Enabled = false}, "LuaTinker.GameSample" = {Enabled = false}}

[Configs.Test.Win64]
AllocStackTraceDepth = 5
ConfigSelections = {"LuaTinker.BasicSample" = {Enabled = false}, "LuaTinker.GameSample" = {Enabled = false}, "LuaTinker.Playground" = {Enabled = false}}

[Configs.Test.Linux64]
ConfigSelections = {"LuaTinker.BasicSample" = {Enabled = false}, "LuaTinker.GameSample" = {Enabled = false}, "LuaTinker.Playground" = {Enabled = false}}

[Configs.Release.wasm32]
EmitDebugInfo = "No"
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}, "LuaTinker.BasicSample" = {Enabled = false}, "LuaTinker.GameSample" = {Enabled = false}}

[Configs.Release.Win64]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Release.Linux64]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Paranoid.Win64]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Paranoid.Linux64]
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}}

[Configs.Paranoid.wasm32]
AllocType = "CRT"
EnableObjectDebugFlags = false
EmitObjectAccessCheck = false
ConfigSelections = {"LuaTinker.Tests" = {Enabled = false}, "LuaTinker.BasicSample" = {Enabled = false}, "LuaTinker.GameSample" = {Enabled = false}}
