FileVersion = 1
ExtraPlatforms = ["Linux32", "Linux64"]

[Workspace]
StartupProject = "LuaTinker.Playground"

[Projects]
LuaTinker = {Path = "."}
KeraLua = {Git = "https://github.com/disarray2077/KeraLua-Beef"}
"LuaTinker.Tests" = {Path = "Tests"}
KeraLua = {Path = "../KeraLua-Beef"}
"LuaTinker.BasicSample" = {Path = "Sample"}
"LuaTinker.GameSample" = {Path = "GameSample"}
"LuaTinker.Playground" = {Path = "Playground"}
BeefGL = {Git = "https://github.com/disarray2077/BeefGL"}
StbImageBeef = {Git = "https://github.com/StbBeef/StbImageBeef?path=/src/StbImageBeef"}
SDL2 = "*"

[Configs.Debug.Win64]
AllocStackTraceDepth = 5

[Configs.Release_O0.Win64]
LTOType = "None"
ConfigSelections = {LuaTinker = {Config = "Release"}, "LuaTinker.Tests" = {Config = "Release"}, KeraLua = {Config = "Release"}, "LuaTinker.BasicSample" = {Config = "Release"}}

[Configs.Test.Win64]
AllocStackTraceDepth = 5
